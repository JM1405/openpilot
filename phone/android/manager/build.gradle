plugins { id 'com.android.application' }
android {
  namespace 'dev.koranipilot.manager'
  compileSdk 36
  defaultConfig {
    applicationId 'dev.koranipilot.manager'
    minSdk 26
    targetSdk 36
    versionCode 21
    versionName '0.21-model-selection'
    testInstrumentationRunner project.findProperty('koraniTestRunner') ?: 'dev.koranipilot.manager.LifecycleProbe'
    ndk { abiFilters 'arm64-v8a' }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
  // KNNaviView internally uses ViewBinding even with a programmatic host layout.
  buildFeatures { viewBinding true }
  sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/sharedTransport')
}
dependencies {
  implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
  implementation 'com.kakaomobility.knsdk:knsdk_ui:1.12.8-hotfix03'
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
// The management APK has no TMAP EDC dependency. It reuses only the pinned
// HTTPS client that is also exercised by the existing companion fixtures.
tasks.register('copySharedTransport', Sync) {
  from('../app/src/main/java') { include 'dev/comma/companion/PhoneClient.java', 'dev/comma/companion/PinnedTls.java' }
  from('../gpslive/src/main/java') { include 'dev/comma/gpslive/LiveFix.java', 'dev/comma/gpslive/LiveSession.java' }
  into layout.buildDirectory.dir('generated/sharedTransport')
}
tasks.named('preBuild').configure { dependsOn 'copySharedTransport' }
